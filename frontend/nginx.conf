# ── nginx: sirve el frontend y hace de puerta única ────────────────────
#
# El navegador habla solo con nginx. Las llamadas al API y los WebSockets
# se reenvían por dentro al backend, así que todo viaja bajo el mismo
# origen y NO hace falta configurar CORS. Es el mismo montaje que ya
# probamos con el túnel, donde funcionó.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare / balanceador delante: sin esto el backend registra la IP
    # del proxy en vez de la del visitante, y el limitador de peticiones
    # acabaría bloqueando a todo el mundo a la vez.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;

    client_max_body_size 25M;   # adjuntos de reclamo

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Libro público (rutas del backend, no del SPA) ──────────────────
    #
    # Ojo con el orden: /libro/<slug> es una PÁGINA del frontend, pero
    # /libro/<slug>/tenant es una LLAMADA al backend. Solo se reenvían las
    # que terminan en un recurso conocido; el resto cae al SPA de abajo.
    location ~ ^/libro/[^/]+/(tenant|sedes|reclamos|mensajes)$ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/libro/[^/]+/(seguimiento/[^/]+|consulta-documento/.+|validar-empresa/.+) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage-api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 25M;
    }

    location /webhook/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── WebSockets ─────────────────────────────────────────────────────
    # Upgrade y Connection son obligatorios: sin ellos nginx trata la
    # conexión como HTTP normal y el socket se cierra al instante.
    # El timeout largo evita que se corte una conversación abierta.
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Estáticos ──────────────────────────────────────────────────────
    # Los archivos con hash en el nombre no cambian nunca: se cachean un
    # año. index.html jamás, porque es quien apunta a los hashes nuevos;
    # si se cachea, el navegador sigue pidiendo la versión vieja tras cada
    # despliegue.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # ── SPA ────────────────────────────────────────────────────────────
    # Cualquier otra ruta devuelve index.html para que React Router se
    # encargue. Sin esto, recargar en /reclamos/123 da un 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
